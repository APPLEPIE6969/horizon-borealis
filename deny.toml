# cargo-deny configuration: keep the dependency tree permissively licensed and
# free of banned/duplicate crates. Run with `cargo deny check bans licenses sources`.

[licenses]
# Permissive licenses only; the vendored third_party/ crates keep their own
# upstream licenses (documented in THIRD_PARTY_NOTICES.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "WTFPL",
]

[bans]
# Duplicated crate versions are noisy but not a hard failure; surface them.
multiple-versions = "warn"
wildcards = "deny"
# Common transitive duplicates that are known and harmless.
skip = [
    { crate = "bitflags", reason = "1.x and 2.x coexist across the ecosystem" },
    { crate = "hashbrown", reason = "0.14/0.15 coexist across the ecosystem" },
    { crate = "syn", reason = "1.x and 2.x coexist across the ecosystem" },
]

[sources]
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "warn"
allow-git = []
