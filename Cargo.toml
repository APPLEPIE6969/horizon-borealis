[workspace]
members = ["crates/horizon-shader-api", "crates/horizon-shader-gallery"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# Line tables keep file:line in backtraces; full debug info makes every test
# binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"
