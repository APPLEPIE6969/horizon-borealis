[package]
name = "horizon-shader-gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Renders Horizon's shader packs headless (wgpu) to check their look: golden-image tests and the gallery of the packs in crates/horizon-shader-api/packs"

[dependencies]
horizon-shader-api = { path = "../horizon-shader-api" }
bytemuck = { version = "1.24", features = ["derive"] }
png = "0.18"
pollster = "0.4"
wgpu = "30.0.1"

[lints]
workspace = true
