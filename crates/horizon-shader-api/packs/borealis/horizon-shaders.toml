# Borealis: an Enhanced-look shader pack written for Horizon's shader API.
# The stars and the water waves are ported from Photon Shaders (SixthSurge),
# whose license permits redistributing modified portions (see LICENSE);
# the AgX curve is iolite's MIT minimal AgX. The rest is this pack's own work,
# MIT. See README.md for the full story and credits.
schema = 1
id = "borealis"
name = "Borealis"
version = "0.1.3"
api = "0.1"
description = "A physical sky, soft sun shadows, rippling and reflecting water, bloom and a filmic grade — written for Horizon, with stars and water ported from Photon."
authors = ["Horizon", "SixthSurge (Photon, ported portions)"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
files = ["lib/atmosphere.wgsl", "lib/stars.wgsl"]
sun = false
stars = false

[material]
file = "material.wgsl"
files = ["lib/waves.wgsl", "lib/lighting.wgsl"]
fog = false

[weather]
file = "weather.wgsl"

[[post]]
file = "post/bloom_extract.wgsl"
name = "Bloom threshold"
output = "bloom"
scale = 0.5

[[post]]
file = "post/blur_h.wgsl"
name = "Bloom blur"
output = "bloom2"
scale = 0.25

[[post]]
file = "post/blur_v.wgsl"
name = "Bloom blur"
output = "bloom3"
scale = 0.25

[[post]]
file = "post/final.wgsl"
name = "Final grade"
files = ["lib/tonemap.wgsl"]

[shadow]
resolution = 2048
distance = 128.0
solid_materials = [10]

[reflection]
option = "reflections"

[[tags]]
id = "glass"
sprites = ["block/glass", "block/*_stained_glass", "block/glass_pane_top"]

[[materials]]
id = 10
sprites = ["block/*_leaves"]

[[materials]]
id = 11
sprites = ["block/short_grass", "block/tall_grass", "block/tall_grass_top", "block/fern", "block/large_fern_top", "block/large_fern_bottom", "block/grass_block_top", "block/sweet_berry_bush_stage*", "block/*_sprouts", "block/closed_eyeblossom", "block/open_eyeblossom", "block/*_bush"]

[[materials]]
id = 12
sprites = ["block/dandelion", "block/poppy", "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/torchflower", "block/sunflower_front", "block/sunflower_back", "block/sunflower_top", "block/peony_top", "block/peony_bottom", "block/rose_bush_top", "block/rose_bush_bottom", "block/lilac_top", "block/lilac_bottom", "block/pitcher_plant_top", "block/pitcher_plant_bottom", "block/pink_petals", "block/wildflowers", "block/leaf_litter"]

[[materials]]
id = 13
sprites = ["block/wheat", "block/carrots", "block/potatoes", "block/beetroots", "block/nether_wart", "block/firefly_bush"]

[[materials]]
id = 14
sprites = ["block/*_sapling", "block/bamboo_stage*", "block/bamboo_large_leaves", "block/bamboo_small_leaves", "block/torchflower_crop", "block/pitcher_crop_top", "block/pitcher_crop_bottom"]

[[materials]]
id = 15
sprites = ["block/*_candle*", "block/candle"]

[[materials]]
id = 16
sprites = ["block/*_hanging_sign", "block/*_standing_sign", "block/*_wall_sign"]

[[materials]]
id = 20
sprites = ["block/sugar_cane"]

[[materials]]
id = 21
sprites = ["block/glow_lichen", "block/hang*"]

[[materials]]
id = 22
sprites = ["block/vine", "block/*_vine", "block/*_vine_*", "block/twisting_vines_plant", "block/weeping_vines_plant", "block/cave_vines", "block/cave_vines_plant", "block/cave_vines_body_with_berries", "block/cave_vines_head_with_berries"]

[[materials]]
id = 30
sprites = ["block/lily_pad", "block/big_dripleaf_top", "block/big_dripleaf_side", "block/big_dripleaf_stem_top", "block/small_dripleaf_top", "block/small_dripleaf_side"]

[[materials]]
id = 31
sprites = ["block/azalea_leaves", "block/flowering_azalea_leaves", "block/mangrove_roots_side", "block/mangrove_roots_top"]

[[lights]]
color = [1.0, 0.35, 0.1]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp", "redstone_wire"]

[[lights]]
color = [0.3, 0.7, 1.0]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire", "soul_fire"]

[[lights]]
color = [0.9, 0.6, 0.3]
blocks = ["*candle*", "sea_pickle", "*_candle"]

[[lights]]
color = [0.35, 0.85, 0.85]
blocks = ["sea_lantern", "glow_lichen", "sculk_catalyst", "sculk_sensor", "sculk_shrieker"]

[[lights]]
color = [0.6, 0.3, 1.0]
blocks = ["amethyst_cluster", "amethyst_large_buds", "amethyst_medium_buds", "amethyst_small_buds", "crying_obsidian", "respawn_anchor", "portal"]

[[textures]]
id = "noise"
file = "noise.png"

[[options]]
id = "soft_shadows"
name = "Soft shadows"
description = "Slightly noisy, filtered sun and moon shadows instead of hard ones."
type = "bool"
default = true

[[options]]
id = "shadow_strength"
name = "Shadow strength"
description = "How dark terrain gets away from the sun (and moon)."
type = "float"
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far from the camera shadows reach. Farther is softer and slower."
type = "choice"
values = ["32", "64", "128", "256"]
default = "128"

[[options]]
id = "sunlight_amount"
name = "Sunlight"
description = "How strongly the sun and moon light the world."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "ambient_amount"
name = "Ambient light"
description = "The sky's own light on terrain."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "blocklight_amount"
name = "Block light"
description = "How strongly torches and other block light glow."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "blocklight_color"
name = "Colored block light"
description = "Torches, soul fire, amethyst and friends tint their light."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Water waves"
description = "The ripples' shading on water."
type = "bool"
default = true

[[options]]
id = "reflections"
name = "Water reflections"
description = "The world mirrored on water. Off falls back to the sky's colour."
type = "bool"
default = true

[[options]]
id = "water_clarity"
name = "Water clarity"
description = "How far you can see into water."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "specular"
name = "Specular highlights"
description = "The sun's glint on smooth and wet surfaces."
type = "bool"
default = true

[[options]]
id = "sun_glow"
name = "Sun glow"
description = "The halo the sky draws around the sun and moon."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "stars_brightness"
name = "Stars"
description = "The night sky's stars."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "bloom_strength"
name = "Bloom"
description = "The halo around bright things: the sun, lava, torches."
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
description = "How bright the picture is, before the tone curve."
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "tonemap"
name = "Tone mapping"
description = "The film curve. AgX is Bliss's; the others are its alternatives."
type = "choice"
values = ["AgX", "ACES", "Lottes", "Hable", "Uchimura", "Reinhard"]
default = "AgX"

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.15
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

[[options]]
id = "purkinje"
name = "Night desaturation"
description = "Your eyes' shift toward blue-grey in the dark."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "fog_density"
name = "Fog density"
description = "How much haze hangs over the world."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[pages]]
id = "main"
name = "Borealis"
items = ["page:lighting", "page:water", "page:sky", "page:post"]

[[pages]]
id = "lighting"
name = "Lighting"
description = "Shadows and the strength of every kind of light."
items = ["soft_shadows", "shadow_strength", "shadow_distance", "sunlight_amount", "ambient_amount", "blocklight_amount", "blocklight_color", "specular"]

[[pages]]
id = "water"
name = "Water"
description = "Waves, reflections and clarity."
items = ["water_waves", "reflections", "water_clarity"]

[[pages]]
id = "sky"
name = "Sky & atmosphere"
description = "The sun's glow, the stars and the fog."
items = ["sun_glow", "stars_brightness", "fog_density"]

[[pages]]
id = "post"
name = "Post-processing"
description = "The film look put over the finished frame."
items = ["bloom_strength", "exposure", "tonemap", "saturation", "contrast", "vignette", "purkinje"]

[budget]
gpu_ms = 2.5
