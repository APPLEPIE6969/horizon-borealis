name: checks
# Every push to main and every pull request: format, lint and tests for the
# pack toolchain (verify), cross-platform compile coverage (cross), the
# gallery's golden-image GPU tests on pinned SwiftShader (gpu-golden), the
# shader-pack check + reproducible packaging (shader-validation), rustdoc
# (doc), the declared MSRV (msrv) and dependency hygiene (deny).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks; main's runs all finish.
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting and lint
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the pack toolchain and the gallery harness
        run: |
          cargo +stable test --workspace --locked --lib --bins --tests
          cargo +stable test --workspace --locked --doc

  # Cross-platform compile coverage: windows and macOS build the workspace and
  # lint it, and the GPU-dependent tests skip themselves where no adapter
  # exists (tests/gpu.rs).
  cross:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  # The golden-image and WGSL-probe GPU tests on a real (software) Vulkan
  # device: chrome-headless-shell ships SwiftShader plus the Vulkan loader.
  # The version is pinned so the frozen golden images stay comparable; the
  # comparator's tolerances absorb the rest of the drift.
  gpu-golden:
    name: golden images (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - name: Set up SwiftShader
        run: |
          curl -sSL -o /tmp/chs.zip "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-headless-shell-linux64.zip"
          unzip -q /tmp/chs.zip -d /tmp/chs
          echo "VK_ICD_FILENAMES=/tmp/chs/chrome-headless-shell-linux64/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/tmp/chs/chrome-headless-shell-linux64/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/chs/chrome-headless-shell-linux64" >> "$GITHUB_ENV"
      - name: Render the gallery scenes and compare against the goldens
        run: cargo +stable test -p horizon-shader-gallery --locked

  # The shader-pack toolchain: validate the pack (the check the game, launcher
  # and registry run), then package borealis twice and require byte-identical
  # .hshader output.
  shader-validation:
    name: horizon-shader check + pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - name: Check the Borealis pack
        run: cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- check crates/horizon-shader-api/packs/borealis --json
      - name: Package borealis reproducibly
        run: |
          cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- pack crates/horizon-shader-api/packs/borealis --out /tmp/borealis-a.hshader
          cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- pack crates/horizon-shader-api/packs/borealis --out /tmp/borealis-b.hshader
          cmp /tmp/borealis-a.hshader /tmp/borealis-b.hshader
          sha256sum /tmp/borealis-a.hshader

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo doc
        run: cargo +stable doc --workspace --no-deps --locked

  # The workspace declares 1.85, but the locked dependency tree (naga, wgpu)
  # floors the build at rustc 1.95.
  msrv:
    name: MSRV (1.95) check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on MSRV
        run: cargo +1.95.0 check --workspace --all-targets --locked

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check bans licenses sources
