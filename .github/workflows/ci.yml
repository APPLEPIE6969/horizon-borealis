name: checks
# verify: every pull request and every push to main, on GitHub's runners (the repository is public). It is the
# check main requires, so it never has a condition: a skipped job counts as passed, and every run of this workflow
# must report a real verify (a pull request that changes no Rust finishes it in seconds instead).
# cross: windows and macOS compile and lint coverage (upstream's checks run on Linux only).
# gpu-golden: the gallery's golden-image GPU tests on pinned SwiftShader.
# shader-validation / doc / msrv / deny: shader packs, rustdoc, the declared MSRV, dependency hygiene.
# The upstream vanilla-parity harnesses need self-hosted runners with the maintainer's game files; they
# are not part of this fork's checks.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks; main's runs all finish (releases follow them).
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  # One job, not one per check: each job takes a runner from the organisation's shared pool, and with every pull request
  # and every merge to main starting this workflow, three jobs a run left the pool's queue tens of minutes deep.
  #
  # Where: GitHub's runners. With the repository variable SELF_HOSTED_CI=all (for when that pool is full: their 4 CPUs
  # are about one GitHub runner, docs/ci-runners.md), main's pushes and this repository's own pull requests run on
  # playhorizon's checks runners (label playhorizon-ci); a fork's pull request never does (and the runners refuse it
  # themselves). There the build folder persists (CARGO_TARGET_DIR, outside the checkout), so the apt packages,
  # Python and the Rust cache steps are GitHub's only.
  verify:
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # A pull request adds only its own commits to main, so it reads those; main's pushes read every ref's history.
      - name: Keep game artifacts out of Git
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/check_public_tree.py
          if [ "$EVENT" = pull_request ]; then
            python tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python tools/check_public_tree.py --history
          fi
      - name: Test offline research tooling
        run: python -m unittest discover -s tests -v
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependencies and the workspace's own build, saved from main's runs (pull requests read main's cache).
      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting and lint
        if: steps.rust.outputs.required != 'false'
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets -- -D warnings
          # The server build (released as horizon-engine): the game without sound or controllers.
          cargo +stable clippy -p horizon-client --all-targets --no-default-features -- -D warnings
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which clippy above already
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Test Rust core and voxel kernel correctness
        if: steps.rust.outputs.required != 'false'
        run: |
          cargo +stable test --workspace --lib --bins --tests
          # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
          # prepared vanilla data, so without it they pass at once.
          cargo +stable test --workspace --lib mod_content::tests:: -- --ignored
          cargo +stable test --workspace --doc
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so is every push to main: two pull requests can each pass
  # alone and break it together (#2059 and the registry ratings did, 2026-10-26).
  launcher:
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this pull request change the launcher or a crate it builds?
        if: github.event_name == 'pull_request'
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --launcher "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Rust and the headers GPUI links against
        if: steps.launcher.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.launcher.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the launcher's formatting, lint and tests
        if: steps.launcher.outputs.required != 'false'
        working-directory: launcher
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          cargo +stable test --locked --lib
  # Cross-platform compile coverage: the upstream checks run on Linux only;
  # windows and macOS build the workspace and lint it, and the GPU-dependent
  # tests skip themselves where no adapter exists (tests/gpu.rs and friends).
  cross:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  # The golden-image and WGSL-probe GPU tests on a real (software) Vulkan
  # device: chrome-headless-shell ships SwiftShader plus the Vulkan loader.
  # The version is pinned so the frozen golden images stay comparable; the
  # comparator's tolerances absorb the rest of the drift.
  gpu-golden:
    name: golden images (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - name: Install the ALSA and udev headers the client links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Set up SwiftShader
        run: |
          curl -sSL -o /tmp/chs.zip "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-headless-shell-linux64.zip"
          unzip -q /tmp/chs.zip -d /tmp/chs
          echo "VK_ICD_FILENAMES=/tmp/chs/chrome-headless-shell-linux64/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/tmp/chs/chrome-headless-shell-linux64/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/chs/chrome-headless-shell-linux64" >> "$GITHUB_ENV"
      - name: Render the gallery scenes and compare against the goldens
        run: cargo +stable test -p horizon-shader-gallery --locked

  # The shader-pack toolchain: validate every pack in the tree (the check the
  # game, launcher and registry run), then package borealis twice and require
  # byte-identical .hshader output.
  shader-validation:
    name: horizon-shader check + pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - name: Check every shader pack
        run: |
          cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- check crates/horizon-shader-api/packs/golden_hour --json
          cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- check crates/horizon-shader-api/packs/borealis --json
      - name: Package borealis reproducibly
        run: |
          cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- pack crates/horizon-shader-api/packs/borealis --out /tmp/borealis-a.hshader
          cargo +stable run --locked -p horizon-shader-api --bin horizon-shader -- pack crates/horizon-shader-api/packs/borealis --out /tmp/borealis-b.hshader
          cmp /tmp/borealis-a.hshader /tmp/borealis-b.hshader
          sha256sum /tmp/borealis-a.hshader

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the ALSA and udev headers the client links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: cargo doc
        run: cargo +stable doc --workspace --no-deps --locked

  # The per-crate rust-version metadata floors the tree at rustc 1.95
  # (the workspace-level 1.85 declaration is stale upstream).
  msrv:
    name: MSRV (1.95) check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the ALSA and udev headers the client links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: cargo check on MSRV
        run: cargo +1.95.0 check --workspace --all-targets --locked

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check bans licenses sources
